<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bốn Mùa</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="card">
            <h1 class="title">BỐN MÙA</h1>

            <div class="stanza stanza-blue">
                <p>Xuân về hoa nở khắp trời</p>
                <p>Hạ sang nắng cháy rạng ngời phố quen</p>
                <p>Thu về lá rụng bên thềm</p>
            </div>

            <hr class="divider">
            <div class="stanza stanza-red">
                <p>Đông sang gió lạnh bên em đợi chờ</p>
                <p>Bốn mùa là bốn mùa mơ</p>
                <p>Thời gian đi mãi ta chờ đợi ai</p>
            </div>

            <hr class="divider">
            <div class="stanza stanza-blue">
                <p>Một năm rồi lại một năm</p>
                <p>vẫn còn câu hát thì thầm quê hương</p>
                <p>Chờ xuân nắng mới soi đường</p>
            </div>

        </div>
    </body>
</html>
